name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build bundle
        run: node build.mjs
      - name: Attach ha-lovelace-cards.js to the release
        uses: softprops/action-gh-release@v2
        with:
          files: ha-lovelace-cards.js
